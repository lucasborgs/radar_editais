# Fly.io configuration for Radar de Editais backend
# See ADR-001-decisoes-iniciais.md (D1, D3, D4)

app = "radar-editais"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["web"]

[processes]
  web = "uvicorn backend.api:app --host 0.0.0.0 --port 8000"
  # Background job runner (ADR M8 — procrastinate replaces the original pg-boss plan from D3).
  worker = "python -m procrastinate --app=core.tasks.app worker"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["web", "worker"]

[env]
  LLM_BACKEND = "openai"
  OPENAI_MODEL = "gpt-4o-mini"
  # Lê os blobs do knowledge graph da tabela kg_artifacts (Supabase), não de
  # arquivos locais — que não existem na imagem. Ver core/kg_store.py + migração 016.
  KG_STORE_BACKEND = "postgres"
  # Secrets set via: fly secrets set OPENAI_API_KEY=... SUPABASE_URL=... SUPABASE_ANON_KEY=... SUPABASE_SERVICE_KEY=... SUPABASE_JWT_SECRET=...
