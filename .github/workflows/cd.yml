name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # workflow_run has a different github.sha (the workflow's default ref).
  # Keep source checkout, image tag and runtime identity on the CI-approved SHA.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  RECOVERY_POSTGRES_IMAGE: postgres:17.4-alpine3.21
  RECOVERY_DOCKER_PLATFORM: linux/arm64

concurrency:
  group: radar-production-deploy
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy and smoke staging-local
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, radar-production-host]
    environment: staging
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify staging release identity
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Configure Docker for the non-interactive runner
        run: |
          docker_config="$RUNNER_TEMP/docker-config"
          mkdir -p "$docker_config"
          printf '{"auths":{},"cliPluginsExtraDirs":["/Applications/Docker.app/Contents/Resources/cli-plugins"]}\n' > "$docker_config/config.json"
          chmod 700 "$docker_config"
          chmod 600 "$docker_config/config.json"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"

      - name: Load staging deployment files
        run: |
          source_dir="$HOME/.config/radar-editais"
          test -f "$source_dir/.env.staging-local" || {
            echo "Missing $source_dir/.env.staging-local on the deployment host" >&2
            exit 1
          }
          install -m 600 "$source_dir/.env.staging-local" .env.staging-local

      - name: Validate deployment host
        run: |
          test -f .env.staging-local || {
            echo "Missing .env.staging-local after loading runner-local files" >&2
            exit 1
          }
          docker info >/dev/null
          docker compose version
          supabase --version
          node --version
          npm --version

      - name: Preflight recovery tool image for production
        run: |
          set -euo pipefail
          # Docker Desktop no macOS trava o keychain em sessão de LaunchAgent
          # não interativa. Se a imagem fixada já estiver no daemon local, não
          # puxamos de novo: o snapshot usa `docker run --pull=never`, então a
          # presença local com o digest fixado é suficiente.
          if docker image inspect --format '{{.Id}}' "$RECOVERY_POSTGRES_IMAGE" >/dev/null 2>&1; then
            echo "recovery image already present locally; skipping pull"
          else
            docker pull --platform "$RECOVERY_DOCKER_PLATFORM" "$RECOVERY_POSTGRES_IMAGE"
          fi
          recovery_image_id="$(docker image inspect --format '{{.Id}}' "$RECOVERY_POSTGRES_IMAGE")"
          test -n "$recovery_image_id"
          docker run --rm --platform "$RECOVERY_DOCKER_PLATFORM" "$recovery_image_id" \
            sh -ec 'pg_dump --version && pg_restore --version'

      - name: Start local Supabase and apply migrations
        run: |
          supabase start
          # O banco local é compartilhado com o host de dev (mesma máquina do
          # runner). Jobs anteriores podem ter aplicado migrations de branches
          # ainda não mergeadas (ex.: 058/059 da RT), deixando o histórico à
          # frente do diretório de main — `supabase migration up` recusa esse
          # drift. `db reset` recria o schema a partir das migrations do
          # checkout (001-057), determinístico por deploy. O seed é obrigatório:
          # insere a sentinela environment_metadata e o workspace EVAL que o
          # app enforca em startup (assert_runtime_environment).
          supabase db reset
          eval "$(supabase status -o env | sed 's/^/LOCAL_/')"
          {
            echo "SUPABASE_URL=$LOCAL_API_URL"
            echo "SUPABASE_ANON_KEY=$LOCAL_ANON_KEY"
            echo "SUPABASE_SERVICE_KEY=$LOCAL_SERVICE_ROLE_KEY"
            echo "SUPABASE_JWT_SECRET=$LOCAL_JWT_SECRET"
            echo "DATABASE_URL=$LOCAL_DB_URL"
            echo "ENVIRONMENT=test"
            echo "INTEGRATION_TARGET=local"
            echo "EMBEDDING_DIMENSIONS=1536"
          } >> "$GITHUB_ENV"

      - name: Install smoke dependencies
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/pip install -e ".[dev]"
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and start staging services
        env:
          IMAGE_TAG: ${{ env.RELEASE_SHA }}
          COMMIT_SHA: ${{ env.RELEASE_SHA }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          scripts/compose.sh staging-local build app worker
          scripts/compose.sh staging-local up -d app worker

      - name: Start frontend for staging smoke
        working-directory: frontend
        run: |
          export NEXT_PUBLIC_API_URL=http://127.0.0.1:8001
          export NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          npm run dev -- --hostname 127.0.0.1 --port 3000 \
            > "$RUNNER_TEMP/radar-staging-frontend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/radar-staging-frontend.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/radar-staging-frontend.log" >&2
          exit 1

      - name: Run authenticated staging smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONSULTANT_SMOKE_API_URL: http://127.0.0.1:8001
          CONSULTANT_SMOKE_FRONTEND_URL: http://127.0.0.1:3000
        run: |
          .ci-venv/bin/pytest -m integration \
            tests/integration/test_consultant_journey_smoke.py -v

      - name: Stop staging smoke frontend
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/radar-staging-frontend.pid"; then
            kill "$(cat "$RUNNER_TEMP/radar-staging-frontend.pid")" 2>/dev/null || true
          fi

      - name: Remove staging deployment files from checkout
        if: always()
        run: rm -f .env.staging-local

  production:
    name: Deploy production
    needs: staging
    runs-on: [self-hosted, radar-production-host]
    environment: Production
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify production release identity
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Configure Docker for the non-interactive runner
        run: |
          docker_config="$RUNNER_TEMP/docker-config"
          mkdir -p "$docker_config"
          printf '{"auths":{},"cliPluginsExtraDirs":["/Applications/Docker.app/Contents/Resources/cli-plugins"]}\n' > "$docker_config/config.json"
          chmod 700 "$docker_config"
          chmod 600 "$docker_config/config.json"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"

      - name: Load production deployment files
        run: |
          source_dir="$HOME/.config/radar-editais"
          test -f "$source_dir/.env" || {
            echo "Missing $source_dir/.env on the deployment host" >&2
            exit 1
          }
          test -f "$source_dir/cloudflared/config.yml" || {
            echo "Missing $source_dir/cloudflared/config.yml on the deployment host" >&2
            exit 1
          }
          install -m 600 "$source_dir/.env" .env
          mkdir -p cloudflared
          cp -R "$source_dir/cloudflared/." cloudflared/

      - name: Validate production host
        run: |
          test -f .env || {
            echo "Missing .env after loading runner-local files" >&2
            exit 1
          }
          test -f cloudflared/config.yml || {
            echo "Missing cloudflared/config.yml after loading runner-local files" >&2
            exit 1
          }
          grep -q '^ENVIRONMENT=production$' .env || {
            echo ".env must declare ENVIRONMENT=production" >&2
            exit 1
          }
          if grep -Eq '^DEMO_MODE=(1|true|yes|on)$' .env; then
            echo "DEMO_MODE is forbidden in production" >&2
            exit 1
          fi
          docker info >/dev/null
          docker compose version
          supabase --version

      - name: Confirm production project identity
        run: |
          project_ref="$(sed -n 's#^SUPABASE_URL=https://\([^./]*\)\..*#\1#p' .env | head -n 1)"
          test -n "$project_ref" || {
            echo "Could not derive the production Supabase project ref from .env" >&2
            exit 1
          }
          echo "CONFIRM_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"

      - name: Inspect currently running production images
        run: |
          set -euo pipefail
          app_container="$(scripts/compose.sh production ps -q app)"
          worker_container="$(scripts/compose.sh production ps -q worker)"
          test -n "$app_container" || {
            echo "No running production app container to use as a rollback reference" >&2
            exit 1
          }
          test -n "$worker_container" || {
            echo "No running production worker container to use as a rollback reference" >&2
            exit 1
          }
          app_image="$(docker inspect --format '{{.Config.Image}}' "$app_container")"
          worker_image="$(docker inspect --format '{{.Config.Image}}' "$worker_container")"
          app_image_id="$(docker inspect --format '{{.Image}}' "$app_container")"
          worker_image_id="$(docker inspect --format '{{.Image}}' "$worker_container")"
          docker image inspect "$app_image" "$worker_image" >/dev/null
          test -n "$app_image_id"
          test -n "$worker_image_id"
          {
            echo "### Production rollback reference"
            echo "- app: \`$app_image $app_image_id\`"
            echo "- worker: \`$worker_image $worker_image_id\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create verified recovery snapshot before migrations
        env:
          PGDATABASE: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$PGDATABASE" || {
            echo "PROD_DATABASE_URL is required to create the production recovery snapshot" >&2
            exit 1
          }
          command -v shasum >/dev/null

          backup_root="$HOME/.local/share/radar-editais/recovery-snapshots"
          install -d -m 700 "$backup_root"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup_path="$backup_root/radar-editais-${RELEASE_SHA}-${stamp}.dump"
          backup_name="$(basename "$backup_path")"
          recovery_image_id="$(docker image inspect --format '{{.Id}}' "$RECOVERY_POSTGRES_IMAGE")"
          test -n "$recovery_image_id" || {
            echo "The preflighted recovery image is unavailable" >&2
            exit 1
          }
          trap 'rm -f "$backup_path"' ERR

          umask 077
          docker run --rm --pull=never --platform "$RECOVERY_DOCKER_PLATFORM" \
            --env PGDATABASE \
            --user "$(id -u):$(id -g)" \
            --volume "$backup_root:/backups" \
            "$recovery_image_id" \
            pg_dump --format=custom --file="/backups/$backup_name"
          test -s "$backup_path"
          test -O "$backup_path"
          chmod 600 "$backup_path"
          docker run --rm --pull=never --platform "$RECOVERY_DOCKER_PLATFORM" \
            --user "$(id -u):$(id -g)" \
            --volume "$backup_root:/backups:ro" \
            "$recovery_image_id" \
            pg_restore --list "/backups/$backup_name" >/dev/null

          digest="$(shasum -a 256 "$backup_path" | awk '{print $1}')"
          {
            echo "### Production recovery snapshot"
            echo "- release: \`$RELEASE_SHA\`"
            echo "- created_at: \`$stamp\`"
            echo "- file: \`$(basename "$backup_path")\`"
            echo "- sha256: \`$digest\`"
            echo "- validation: \`pg_restore --list\` passed"
          } >> "$GITHUB_STEP_SUMMARY"
          trap - ERR

      - name: Apply production migrations with the safety guard
        env:
          ENV_FILE: .env
          ENVIRONMENT: production
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          ALLOW_ENVIRONMENT_INITIALIZATION: "1"
          ALLOW_PRODUCTION_MUTATION: "1"
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/pip install -e .
          .ci-venv/bin/python scripts/supabase_safe.py push

      - name: Build and start production services
        env:
          IMAGE_TAG: ${{ env.RELEASE_SHA }}
          COMMIT_SHA: ${{ env.RELEASE_SHA }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          scripts/compose.sh production build app worker
          scripts/compose.sh production up -d --no-build app worker tunnel

      - name: Verify production health
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              scripts/compose.sh production ps
              exit 0
            fi
            sleep 2
          done
          scripts/compose.sh production ps
          scripts/compose.sh production logs --tail=120 app worker >&2
          exit 1

      - name: Remove production deployment files from checkout
        if: always()
        run: rm -rf .env cloudflared
