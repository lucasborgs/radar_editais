name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      # Não-bloqueante: há erros de tipo legados nunca checados (o CI
      # apontava para um dir 'agents' inexistente e morria antes). Mantemos o
      # sinal visível sem travar o merge; encarar a dívida é trabalho à parte.
      - name: Type check with mypy (gradual scope)
        run: mypy src
        continue-on-error: true

      - name: Run tests
        run: pytest -q

  tenant-isolation:
    name: Tenant isolation leak-test (Supabase)
    runs-on: ubuntu-latest
    # Gate de segurança P0 (docs/reference/tenant-isolation.md). Sobe o Supabase
    # local e roda a suíte adversarial das 4 superfícies. Job SEPARADO do backend:
    # um hiccup do Docker/Supabase não bloqueia a suíte principal — mas um LEAK
    # real (ou a regressão do procrastinate, migration 034) reprova aqui.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # PIN deliberado (não "latest"). A suíte semeia via service_role pelo
          # PostgREST; ela depende dos default privileges do schema `public`
          # (postgres/supabase_admin → anon,authenticated,service_role) que o
          # `supabase start` estabelece, para as migrations 027/034 então
          # REVOGAREM anon/authenticated das tabelas travadas. CLIs recentes
          # (2.99+) regrediram o fresh-start: service_role fica SEM grant nas
          # tabelas de migration → `permission denied for table workspaces` (a
          # suíte nem semeia). 2.98.2 é a versão validada localmente (33 passed).
          # Reproduzível > último. Ver docs/reference/tenant-isolation.md.
          version: 2.98.2

      - name: Start Supabase (aplica migrations, inclui 034)
        run: supabase start

      - name: Exporta env do Supabase local
        run: |
          eval "$(supabase status -o env | sed 's/^/LOCAL_/')"
          {
            echo "SUPABASE_URL=$LOCAL_API_URL"
            echo "SUPABASE_ANON_KEY=$LOCAL_ANON_KEY"
            echo "SUPABASE_SERVICE_KEY=$LOCAL_SERVICE_ROLE_KEY"
            echo "SUPABASE_JWT_SECRET=$LOCAL_JWT_SECRET"
            echo "DATABASE_URL=$LOCAL_DB_URL"
            echo "ENVIRONMENT=test"
            echo "INTEGRATION_TARGET=local"
            echo "EMBEDDING_DIMENSIONS=1536"
          } >> "$GITHUB_ENV"

      - name: Marca a sentinela do banco efêmero como test
        run: python scripts/set_environment_metadata.py --environment test --project-ref local

      - name: Setup checkpointer/store (S3 — tolera falha; o store-test pula sem ele)
        run: python scripts/setup_checkpointer.py || echo "store setup falhou; S3 store-test vai pular"
        continue-on-error: true

      - name: Run local integration suites
        run: pytest -m integration -v

  diagnostic-evaluations:
    name: Diagnostic evaluations (local Supabase)
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      EVAL_EXPLORE_CONNECTED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Start Supabase (applies migrations)
        run: supabase start

      - name: Export local Supabase environment
        run: |
          eval "$(supabase status -o env | sed 's/^/LOCAL_/')"
          {
            echo "SUPABASE_URL=$LOCAL_API_URL"
            echo "SUPABASE_ANON_KEY=$LOCAL_ANON_KEY"
            echo "SUPABASE_SERVICE_KEY=$LOCAL_SERVICE_ROLE_KEY"
            echo "SUPABASE_JWT_SECRET=$LOCAL_JWT_SECRET"
            echo "DATABASE_URL=$LOCAL_DB_URL"
            echo "INTEGRATION_TARGET=local"
            echo "EMBEDDING_DIMENSIONS=1536"
          } >> "$GITHUB_ENV"

      - name: Mark ephemeral database as test
        run: python scripts/set_environment_metadata.py --environment test --project-ref local

      - name: Check evaluation prerequisites
        run: |
          python -c "import pytest; print('pytest available')"

      - name: Run diagnostic evaluations
        run: |
          set +e
          failed=0
          for suite in explore provenance e2e_health; do
            echo "=== $suite ==="
            python -m radar.core.eval run "$suite"
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "$suite failed with exit code $status" >&2
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload evaluation JSONs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-evaluations-${{ github.run_id }}
          path: eval_results/*.json
          if-no-files-found: error

  consultant-journey-smoke:
    name: ConsultantGraph authenticated smoke (local)
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      INTEGRATION_TARGET: local
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CONSULTANT_SMOKE_API_URL: http://127.0.0.1:8001
      CONSULTANT_SMOKE_FRONTEND_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Start Supabase (applies migrations)
        run: supabase start

      - name: Export local Supabase environment
        run: |
          eval "$(supabase status -o env | sed 's/^/LOCAL_/')"
          {
            echo "SUPABASE_URL=$LOCAL_API_URL"
            echo "SUPABASE_ANON_KEY=$LOCAL_ANON_KEY"
            echo "SUPABASE_SERVICE_KEY=$LOCAL_SERVICE_ROLE_KEY"
            echo "SUPABASE_JWT_SECRET=$LOCAL_JWT_SECRET"
            echo "DATABASE_URL=$LOCAL_DB_URL"
            echo "ENVIRONMENT=test"
            echo "INTEGRATION_TARGET=local"
            echo "EMBEDDING_DIMENSIONS=1536"
          } >> "$GITHUB_ENV"

      - name: Mark ephemeral database as test
        run: python scripts/set_environment_metadata.py --environment test --project-ref local

      - name: Check smoke prerequisites
        run: |
          test -n "$OPENAI_API_KEY" || {
            echo "OPENAI_API_KEY secret is required by the grounded writing smoke" >&2
            exit 1
          }
          test -n "$SUPABASE_URL" || {
            echo "SUPABASE_URL was not exported from the local Supabase instance" >&2
            exit 1
          }

      - name: Start real backend
        run: |
          uvicorn radar.api.app:app --host 127.0.0.1 --port 8001 > /tmp/radar-backend.log 2>&1 &
          echo $! > /tmp/radar-backend.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8001/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy" >&2
          cat /tmp/radar-backend.log >&2
          exit 1

      - name: Start real frontend
        working-directory: frontend
        run: |
          export NEXT_PUBLIC_API_URL=http://127.0.0.1:8001
          export NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/radar-frontend.log 2>&1 &
          echo $! > /tmp/radar-frontend.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/login; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready" >&2
          cat /tmp/radar-frontend.log >&2
          exit 1

      - name: Run authenticated ConsultantGraph smoke
        run: pytest -m integration tests/integration/test_consultant_journey_smoke.py -v

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consultant-journey-smoke-logs-${{ github.run_id }}
          path: /tmp/radar-*.log
          if-no-files-found: warn

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Placeholders: o build (prerender) instancia o client Supabase, que
          # exige URL+key não-vazias. Valores fake bastam para o build estático.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_URL: http://localhost:8000
