services:
  app:
    build: .
    container_name: radar-app
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    command: uvicorn backend.api:app --host 0.0.0.0 --port ${PORT:-8000}
    restart: unless-stopped

  worker:
    build: .
    container_name: radar-worker
    env_file: .env
    volumes:
      - ./data:/app/data
    command: python -m procrastinate --app=core.tasks.app worker
    restart: unless-stopped
    depends_on:
      - app

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: radar-tunnel
    command: tunnel --config /etc/cloudflared/config.yml run
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./cloudflared:/etc/cloudflared
