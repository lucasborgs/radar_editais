services:
  app:
    build:
      context: .
      target: app
    container_name: ${APP_CONTAINER_NAME:-radar-app}
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: ${ENV_FILE:-.env}
    environment:
      SUPABASE_URL: ${DOCKER_SUPABASE_URL:-${SUPABASE_URL}}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    command: uvicorn backend.api:app --host 0.0.0.0 --port ${PORT:-8000}
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    container_name: ${WORKER_CONTAINER_NAME:-radar-worker}
    env_file: ${ENV_FILE:-.env}
    environment:
      SUPABASE_URL: ${DOCKER_SUPABASE_URL:-${SUPABASE_URL}}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
      DISCOVERY_CRAWL4AI_ENABLED: ${DISCOVERY_CRAWL4AI_ENABLED:-1}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    command: python -m procrastinate --app=core.tasks.app worker
    restart: unless-stopped
    depends_on:
      - app

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ${TUNNEL_CONTAINER_NAME:-radar-tunnel}
    command: tunnel --config /etc/cloudflared/config.yml run
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./cloudflared:/etc/cloudflared
