[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-editais"
version = "0.1.0"
description = "Plataforma de matching empresa-edital com pipeline ETL e agentes LLM"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "requests>=2.31",
    "supabase>=2.4",
    "PyJWT>=2.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "pipeline*", "core*", "agents*", "domain*", "scripts*"]

[tool.setuptools]
py-modules = ["config"]
