[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-editais"
version = "0.1.0"
description = "Plataforma de matching empresa-edital com pipeline ETL e agentes LLM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "anthropic>=0.40",               # Sonnet 4.6 para agentes (WritingSession + explore)
    # Runtime agêntico LangGraph (migração — docs/specs/langgraph-migration.md).
    # Runtime único desde a Etapa 2 (legado deletado). checkpoint-postgres: durabilidade
    # da WritingSession + interrupt/resume de request_user_info (Etapa 3) sobre DATABASE_URL.
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=2",
    "langchain-core>=1.4",
    "langchain-anthropic>=1.4",
    "langchain-openai>=1.3",
    "langchain>=1.0",                # meta-pacote exigido pelo langfuse.langchain.CallbackHandler (Etapa 6)
    "langfuse>=4,<5",                # API v4: Experiments, spans e CallbackHandler nativo
    "requests>=2.31",
    "supabase>=2.4",
    "PyJWT>=2.8",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",       # FastAPI form parsing (upload PDF)
    "pypdf>=4.0",                    # PDF extraction (content_library)
    "beautifulsoup4>=4.12",           # HTML parsing (ProfileExtractor + scrapers)
    "trafilatura>=1.8",              # extração de conteúdo principal de HTML (fonte web, base.html_to_text)
    "pdfplumber>=0.10",              # PDF extraction estrutural (WritingSession, chunker)
    "tiktoken>=0.7",                 # token count exato no chunker (budget de chunk; fallback heurístico sem rede)
    "rank-bm25>=0.2.2",              # braço sparse do retriever (BM25 Okapi em Python; saturação k1 + normalização b que o ts_rank não tem)
    "python-docx>=1.1",              # extração de .docx (content_library.extract_document_text)
    # procrastinate ships an async-capable PsycopgConnector by default (psycopg 3 + asyncio).
    # No [asyncpg] extra exists upstream — the base install already brings psycopg[pool].
    "procrastinate>=2.0",
    "psycopg[binary,pool]>=3.1",
    "slowapi>=0.1.9",                # rate limiting (proteção de custo LLM)
    "sentry-sdk>=2.0",               # error tracking (no-op sem SENTRY_DSN; ver core/logging_config)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<0.16",
    "mypy>=1.10,<2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Reranker local do RAG de escrita (Front 4). Opcional: dep pesada (torch).
# Sem ela, RERANK_BACKEND=cross-encoder degrada para RRF puro; use
# RERANK_BACKEND=llm para rerankear via API sem instalar este extra.
rerank = [
    "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "pipeline*", "core*", "domain*", "scripts*"]

[tool.setuptools]
py-modules = ["config"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = [
    "E501",   # line too long handled by formatter
    # Alinhar o parser a 3.12 não deve impor uma modernização mecânica ampla
    # no mesmo lote; estes upgrades ficam para um cleanup dedicado.
    "UP017",  # datetime.UTC
    "UP041",  # TimeoutError builtin
    "UP042",  # StrEnum
    "UP046",  # type parameters (PEP 695)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
# load_dotenv() must run before module imports that read os.environ at import time
"backend/api.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection helpers are evaluated once per request, not at definition time
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Body",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["pipeline/", "data/bronze/", "data/silver/", "data/knowledge_graph/"]

[tool.pytest.ini_options]
markers = [
    "unit: teste hermético, sem rede ou banco externo",
    "integration: integração contra dependência local/efêmera",
    "remote_integration: integração opt-in exclusivamente contra staging",
]

[[tool.mypy.overrides]]
module = "pipeline.*"
ignore_errors = true
